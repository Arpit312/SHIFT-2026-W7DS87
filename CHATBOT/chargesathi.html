<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChargeSathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap">
<style>
/* Layout: one-screen chat app. Header strip (brand, SOS numbers, language), scrolling conversation,
   problem shortcuts, composer. Severity is shown as a shaped badge on every reply. */
:root {
  --bg: #E7EDEF;
  --panel: #FFFFFF;
  --ink: #0E1F27;
  --muted: #4F6472;
  --line: #C9D6DB;
  --accent: #0A7A5E;
  --accent-ink: #FFFFFF;
  --user-bg: #0E1F27;
  --user-fg: #F2F7F8;
  --ok-bg: #DDF3E9;
  --ok-fg: #0C5A3F;
  --warn-bg: #FBEBC8;
  --warn-fg: #6B4300;
  --bad-bg: #FADCDA;
  --bad-fg: #8C1B14;
  --bad-line: #E39A95;
  --font-display: "Familjen Grotesk", "Noto Sans Devanagari", "Noto Sans Bengali", system-ui, sans-serif;
  --font-body: "Public Sans", "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Gujarati", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Gurmukhi", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A141A; --panel: #12212A; --ink: #E4EDF0; --muted: #93A8B4; --line: #243A44;
    --accent: #38D3A2; --accent-ink: #06251C; --user-bg: #24505E; --user-fg: #F2F7F8;
    --ok-bg: #12362B; --ok-fg: #8FE3C0; --warn-bg: #3D2E0C; --warn-fg: #F2C96B;
    --bad-bg: #3F1714; --bad-fg: #FFB4AC; --bad-line: #7A3430;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A141A; --panel: #12212A; --ink: #E4EDF0; --muted: #93A8B4; --line: #243A44;
  --accent: #38D3A2; --accent-ink: #06251C; --user-bg: #24505E; --user-fg: #F2F7F8;
  --ok-bg: #12362B; --ok-fg: #8FE3C0; --warn-bg: #3D2E0C; --warn-fg: #F2C96B;
  --bad-bg: #3F1714; --bad-fg: #FFB4AC; --bad-line: #7A3430;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
}
*, *::before, *::after { box-sizing: border-box; }

.app {
  height: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 34px; height: 34px; flex: none; }
.mark rect { fill: var(--accent); }
.mark path { fill: var(--accent-ink); }
h1 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sos {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
  color: var(--bad-fg); background: var(--bad-bg); border: 1px solid var(--bad-line);
  padding: 3px 9px; border-radius: 6px; white-space: nowrap;
}
.lang { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.lang select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 36px;
}

/* emergency banner */
.alert {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--bad-bg); color: var(--bad-fg); border: 1px solid var(--bad-line);
  border-radius: 10px; padding: 10px 12px 10px 14px; font-weight: 600; line-height: 1.5;
}
.alert[hidden] { display: none; }
.alert p { margin: 0; flex: 1; min-width: 0; }
.alert button {
  flex: none; border: 0; background: transparent; color: inherit; font-size: 22px; line-height: 1;
  padding: 2px 8px; cursor: pointer; border-radius: 6px;
}

/* conversation */
.log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-block: 4px; }
.intro {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; color: var(--ink);
}
.note { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
.msg { max-width: min(94%, 640px); min-width: 0; overflow-wrap: anywhere; }
.msg.user {
  align-self: flex-end; background: var(--user-bg); color: var(--user-fg);
  padding: 10px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap;
}
.msg.bot {
  align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
  padding: 12px 14px; border-radius: 4px 14px 14px 14px;
}
.txt p { margin: 0 0 0.6em; }
.txt ol, .txt ul { margin: 0.2em 0 0.7em; padding-inline-start: 1.5em; }
.txt li { margin: 0.3em 0; padding-inline-start: 0.2em; }
.txt > :last-child { margin-bottom: 0; }

.badge {
  display: inline-flex; align-items: center; gap: 7px; margin-bottom: 8px;
  font-size: 13px; font-weight: 600; line-height: 1.3; padding: 3px 11px 3px 9px; border-radius: 999px;
}
.badge::before { content: ""; width: 9px; height: 9px; background: currentColor; flex: none; }
.badge.low { background: var(--ok-bg); color: var(--ok-fg); }
.badge.low::before { border-radius: 50%; }
.badge.medium { background: var(--warn-bg); color: var(--warn-fg); }
.badge.medium::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.badge.high { background: var(--bad-bg); color: var(--bad-fg); }
.badge.high::before { border-radius: 1px; }

/* charging-cell indicator while the answer is being written */
.cells { display: inline-flex; gap: 3px; vertical-align: middle; padding-block: 4px; }
.cells i { width: 10px; height: 15px; border-radius: 2px; background: var(--line); animation: cell 1.3s ease-in-out infinite; }
.cells i:nth-child(2) { animation-delay: 0.12s; }
.cells i:nth-child(3) { animation-delay: 0.24s; }
.cells i:nth-child(4) { animation-delay: 0.36s; }
.cells i:nth-child(5) { animation-delay: 0.48s; }
@keyframes cell { 0%, 100% { background: var(--line); } 40%, 60% { background: var(--accent); } }
@media (prefers-reduced-motion: reduce) {
  .cells i { animation: none; }
  .cells i:nth-child(-n+3) { background: var(--accent); }
}

.retry {
  margin-top: 8px; font: inherit; font-size: 14px; font-weight: 600; color: var(--accent);
  background: transparent; border: 1px solid var(--accent); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}

/* shortcuts */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chips button {
  flex: none; white-space: nowrap; font: inherit; font-size: 14px; line-height: 1.4; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.chips button:hover:not(:disabled) { border-color: var(--accent); }
.chips button.danger { color: var(--bad-fg); background: var(--bad-bg); border-color: var(--bad-line); }
.chips button:disabled { opacity: 0.55; cursor: default; }
@media (min-width: 700px) { .chips { flex-wrap: wrap; overflow: visible; } }

/* composer */
.composer { display: flex; align-items: flex-end; gap: 8px; }
.composer textarea {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; resize: none;
  min-height: 46px; max-height: 140px; line-height: 1.5;
}
.composer button {
  flex: none; min-height: 46px; padding: 0 20px; font: inherit; font-weight: 600;
  color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
}
.composer button:disabled { opacity: 0.5; cursor: default; }
.foot { margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea:focus-visible { outline-offset: 0; }
</style>
</head>
<body>

<div class="app" id="app" lang="en">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"></rect><path d="M18.5 5 9 18h6l-1.5 9L23 14h-6z"></path></svg>
      <h1>ChargeSathi</h1>
    </div>
    <div class="tools">
      <span class="sos" title="Emergency numbers in India">SOS 112 · FIRE 101</span>
      <label class="lang"><span>Language · भाषा</span><select id="lang"></select></label>
    </div>
  </header>

  <div class="alert" id="alert" role="alert" hidden>
    <p id="alertText"></p>
    <button type="button" id="alertClose" aria-label="Close">×</button>
  </div>

  <main class="log" id="log" role="log" aria-live="polite">
    <section class="intro" id="intro"></section>
  </main>

  <div class="chips" id="chips"></div>

  <form class="composer" id="form" autocomplete="off">
    <textarea id="input" rows="1" enterkeyhint="send"></textarea>
    <button id="sendBtn" type="submit"></button>
  </form>
  <p class="foot" id="foot"></p>
</div>

    ["mr", /(धूर|आग लाग|जळाल्याचा वास|जळका वास|ठिणग्या|ठिणगी|करंट लागला)/],
    ["gu", /(ધુમાડો|આગ લાગ|બળવાની ગંધ|બળતી ગંધ|તણખા|કરંટ લાગ)/],
    ["kn", /(ಹೊಗೆ|ಬೆಂಕಿ|ಸುಟ್ಟ ವಾಸನೆ|ಕಿಡಿ|ಶಾಕ್)/],
    ["ml", /(പുക|തീപിടി|തീപ്പൊരി|കരിഞ്ഞ മണം|ഷോക്ക്)/],
    ["pa", /(ਧੂੰਆਂ|ਅੱਗ|ਸੜਨ ਦੀ|ਚੰਗਿਆੜ|ਕਰੰਟ ਲੱ)/]
  ];

  /* ---------- state and elements ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), log = $("log"), intro = $("intro"), chipsBox = $("chips"), form = $("form"),
      input = $("input"), sendBtn = $("sendBtn"), foot = $("foot"), langSel = $("lang"),
      alertBox = $("alert"), alertText = $("alertText");
  var lang = "auto", history = [], busy = false, offlineNoted = false, lastEmergLang = "en";

  /* ---------- AI backend: server.js keeps the Gemini key and model (see .env) ---------- */
  var hasKey = false;

  /* Streams a reply through the local server (/api/chat). msgs = [{role:"user"|"assistant", content}] */
  function geminiSample(msgs, opts) {
    return (async function () {
      var res;
      try {
        res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: msgs.map(function (m) {
              return { role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] };
            })
          })
        });
      } catch (e) { throw { code: "network" }; }
      if (!res.ok) {
        throw { code: res.status === 429 ? "rate_limited" : res.status === 401 ? "bad_key" : "http" };
      }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = "", full = "";
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        var lines = buf.split("\n"); buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var ln = lines[i].trim();
          if (ln.indexOf("data:") !== 0) continue;
          try {
            var j = JSON.parse(ln.slice(5));
            var parts = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts;
            if (parts) { parts.forEach(function (pt) { if (pt.text) full += pt.text; }); if (opts && opts.onText) opts.onText({ text: full }); }
          } catch (e) { /* partial chunk */ }
        }
      }
      return { text: full };
    })();
  }

  var sampleReady = (async function () {
    try {
      if (location.protocol.indexOf("http") === 0) {
        var st = await fetch("/api/status");
        if (st.ok && (await st.json()).ready) { hasKey = true; return geminiSample; }
      }
    } catch (e) { /* not served by server.js */ }
    try {
      if (window.claude && window.claude.use) { return (await window.claude.use("sample")) || null; }
    } catch (e) { /* no assistant in this view */ }
    return null;
  })();

  function ui() { return STR[lang === "auto" ? "en" : lang]; }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- text rendering (no HTML from the model is ever inserted) ---------- */
  function inline(parent, s) {
    s.split(/\*\*(.+?)\*\*/g).forEach(function (part, i) {
      if (!part) return;
      if (i % 2) { var b = document.createElement("strong"); b.textContent = part; parent.appendChild(b); }
      else parent.appendChild(document.createTextNode(part));
    });
  }
  var NUM = /^\s*([0-9०-९০-৯௦-௯౦-౯೦-೯൦-൯૦-૯੦-੯]{1,2})[.)]\s+(.*)$/;
  function renderText(box, text) {
    box.textContent = "";
    var list = null, kind = null;
    text.replace(/\r/g, "").split("\n").forEach(function (raw) {
      var line = raw.replace(/\s+$/, ""), m;
      if ((m = line.match(NUM))) {
        if (kind !== "ol") { list = document.createElement("ol"); box.appendChild(list); kind = "ol"; }
        var li = document.createElement("li");
        if (/^[0-9]+$/.test(m[1])) li.value = parseInt(m[1], 10);
        inline(li, m[2]); list.appendChild(li);
      } else if ((m = line.match(/^\s*[-•*]\s+(.*)$/))) {
        if (kind !== "ul") { list = document.createElement("ul"); box.appendChild(list); kind = "ul"; }
        var li2 = document.createElement("li"); inline(li2, m[1]); list.appendChild(li2);
      } else if (!line.trim()) { list = null; kind = null; }
      else { list = null; kind = null; var p = document.createElement("p"); inline(p, line.trim()); box.appendChild(p); }
    });
  }

  function toBottom() { log.scrollTop = log.scrollHeight; }

  function cells() {
    var c = el("span", "cells");
    c.setAttribute("aria-label", "…");
    for (var i = 0; i < 5; i++) c.appendChild(document.createElement("i"));
    return c;
  }

  /* ---------- messages ---------- */
  function addUser(text) {
    var m = el("article", "msg user", text);
    log.appendChild(m); toBottom(); return m;
  }
  function addBot() {
    var root = el("article", "msg bot"), txt = el("div", "txt");
    root.appendChild(txt);
    txt.appendChild(cells());
    log.appendChild(root); toBottom();
    var bot = { root: root, txt: txt, badge: null };
    bot.setBadge = function (sev) {
      var idx = { low: 0, medium: 1, high: 2 }[sev];
      if (idx == null) return;
      if (!bot.badge) { bot.badge = el("div", "badge"); root.insertBefore(bot.badge, txt); }
      bot.badge.className = "badge " + sev;
      bot.badge.textContent = ui().sev[idx];
    };
    return bot;
  }

  function parseReply(t) {
    var sev = null, m = t.match(/^\s*\[\[\s*SEV\s*:\s*(low|medium|high)\s*\]\]\s*/i);
    if (m) { sev = m[1].toLowerCase(); t = t.slice(m[0].length); }
    else if (/^\s*\[\[?[^\]]{0,14}\]?$/.test(t)) { t = ""; }
    return { sev: sev, body: t };
  }
  function show(bot, text) {
    var p = parseReply(text);
    if (p.sev) bot.setBadge(p.sev);
    if (p.body.trim()) renderText(bot.txt, p.body);
    if (p.sev === "high") showAlert(lang === "auto" ? lastEmergLang : lang);
    toBottom();
    return p;
  }

  /* ---------- emergency banner ---------- */
  function showAlert(code) { alertText.textContent = (STR[code] || STR.en).emerg; alertBox.hidden = false; }
  function checkEmergency(text) {
    for (var i = 0; i < EMERG.length; i++) {
      if (EMERG[i][1].test(text)) { lastEmergLang = EMERG[i][0]; showAlert(lang === "auto" ? lastEmergLang : lang); return true; }
    }
    return false;
  }
  $("alertClose").addEventListener("click", function () { alertBox.hidden = true; });

  /* ---------- offline guide ---------- */
  function compose(k) {
    return k.intro + "\n" + k.steps.map(function (s, i) { return (i + 1) + ". " + s; }).join("\n") + "\n\n**Next safe step:** " + k.next;
  }
  function answerOffline(bot, text, idx) {
    var k = null;
    if (typeof idx === "number") k = KB[idx];
    else if (checkEmergency(text)) k = KB[5];
    else for (var i = 0; i < KB.length - 1; i++) { if (KB[i].re.test(text)) { k = KB[i]; break; } }
    if (!offlineNoted) {
      offlineNoted = true;
      log.insertBefore(el("div", "note", "The language assistant is not available in this view, so you are seeing the built-in English guide. Tap a common problem below for step-by-step help."), bot.root);
    }
    if (k) {
      bot.setBadge(k.sev);
      renderText(bot.txt, compose(k));
      if (k.sev === "high") showAlert(lang === "auto" ? lastEmergLang : lang);
    } else {
      renderText(bot.txt, "In this view I can only match the common problems below. Tap one, or use words like start, slow, hot, stops, stuck or smoke.");
    }
    toBottom();
  }

  /* ---------- talking to the model ---------- */
  function buildInput() {
    var win = history.slice(-12);
    while (win.length && win[0].role !== "user") win.shift();
    var msgs = win.map(function (m) { return { role: m.role, content: m.content }; });
    if (!hasKey) msgs[0].content = INSTRUCTIONS + "\n\n---\nConversation with the user follows.\n\n" + msgs[0].content;
    var last = msgs[msgs.length - 1];
    last.content += "\n\n" + (lang === "auto"
      ? "[Reply in the same language and script as the message above.]"
      : "[Reply in " + LANG_NAME[lang] + ". Use the native script unless the message above is written in Roman letters.]");
    return msgs;
  }

  function setBusy(b) {
    busy = b; sendBtn.disabled = b;
    Array.prototype.forEach.call(chipsBox.children, function (c) { c.disabled = b; });
  }

  async function send(text, idx) {
    text = (text || "").trim();
    if (!text || busy) return;
    setBusy(true);
    var userEl = addUser(text);
    checkEmergency(text);
    var bot = addBot();
    var s = await sampleReady;
    if (!s) { answerOffline(bot, text, idx); setBusy(false); return; }
    history.push({ role: "user", content: text });
    try {
      var res = await s(buildInput(), {
        cache: false,
        onText: function (o) { show(bot, o.text); }
      });
      var p = show(bot, (res && res.text) || "");
      if (!p.body.trim()) throw { code: "empty" };
      history.push({ role: "assistant", content: p.body });
    } catch (e) {
      history.pop();
      var code = e && e.code;
      if (code === "not_granted") {
        sampleReady = Promise.resolve(null);
        answerOffline(bot, text, idx);
      } else {
        var msg = code === "rate_limited"
          ? "Too many requests right now. Wait a minute and try again."
          : code === "bad_key"
          ? "The Gemini API key was rejected. Check GEMINI_API_KEY in the .env file and restart the server."
          : "I could not get an answer. Check your connection and try again.";
        bot.txt.textContent = "";
        bot.txt.appendChild(el("p", null, msg));
        var r = el("button", "retry", "Try again");
        r.type = "button";
        r.addEventListener("click", function () {
          userEl.remove(); bot.root.remove(); send(text, idx);
        });
        bot.txt.appendChild(r);
      }
    }
    setBusy(false);
    toBottom();
  }

  /* ---------- language and layout ---------- */
  function applyLang() {
    var s = ui();
    app.lang = lang === "auto" ? "en" : lang;
    input.placeholder = s.ph;
    sendBtn.textContent = s.send;
    foot.textContent = s.foot;
    intro.textContent = s.hello;
    chipsBox.textContent = "";
    s.chips.forEach(function (label, i) {
      var b = el("button", i === 5 ? "danger" : "", label);
      b.type = "button";
      b.disabled = busy;
      b.addEventListener("click", function () { send(label, i); });
      chipsBox.appendChild(b);
    });
    try { localStorage.setItem("chargesathi-lang", lang); } catch (e) { /* storage unavailable */ }
  }

  LANGS.forEach(function (l) {
    var o = document.createElement("option");
    o.value = l[0]; o.textContent = l[1]; langSel.appendChild(o);
  });
  try {
    var saved = localStorage.getItem("chargesathi-lang");
    if (saved && (saved === "auto" || STR[saved])) lang = saved;
    else {
      var nl = (navigator.language || "").slice(0, 2);
      if (nl !== "en" && STR[nl]) lang = nl;
    }
  } catch (e) { /* keep default */ }
  langSel.value = lang;
  langSel.addEventListener("change", function () { lang = langSel.value; applyLang(); });
  applyLang();

  function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  input.addEventListener("input", grow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault(); form.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var t = input.value;
    if (!t.trim() || busy) return;
    input.value = ""; grow();
    send(t);
  });
})();
</script>
</body>
</html>
